function browser(){if(state.closed)return desktop();const nt=state.newTab;return '<section class="window" aria-label="Microsoft Edge"><div class="titlebar"><div class="tabs"><div class="tab '+(!nt?'active':'')+'">'+icon('edge')+'Bajki dla dzieci '+btn('tabClose','×','','Zamknij kartę')+'</div>'+(nt?'<div class="tab active">Nowa karta '+btn('tabClose2','×','','Zamknij nową kartę')+'</div>':'')+btn('newTab','+','plus','Nowa karta')+'</div><span class="spacer"></span>'+controls()+'</div><div class="addressRow">'+btn('back','←','','Wstecz')+btn('forward','→','','Dalej')+btn('reload','⟳','','Odśwież')+'<div class="address '+(state.typing?'selectedField':'')+'"><input id="addressField" data-action="address" aria-label="Pasek adresu" readonly placeholder="Wyszukaj lub wpisz adres sieci web" value="'+(nt?'':state.url||'https://bajki.test/')+'">'+btn('addFav','☆','add','Dodaj zakładkę')+'</div>'+btn('favBtn',icon('favs'),'','Ulubione')+btn('profile','●','','Profil')+btn('menu','⋯','','Menu')+'</div><div class="webpage '+(nt?'newPage':'')+'">'+(nt?'<input readonly placeholder="Wyszukaj w internecie"><div style="color:#486789">Bajki &nbsp; &nbsp; Gry &nbsp; &nbsp; Szkoła &nbsp; &nbsp; Muzyka</div>':state.loaded?'<h2>Szkoła</h2><div style="font-size:60px">📚</div><p>Witaj na stronie naszej szkoły!</p>':'<h2>Bajki dla dzieci</h2><div class="storyCards"><div>Bajka 1</div><div>Bajka 2</div><div>Bajka 3</div></div>')+'</div>'+(state.favorites?'<aside class="favorites"><h3>Ulubione</h3>'+btn('favBajki',icon('edge')+' Bajki')+btn('favGry',icon('edge')+' Gry')+btn('favSzkola',icon('edge')+' Szkoła')+'</aside>':'')+'</section>';}
function explorer(){return '<section class="window" aria-label="Eksplorator plików"><div class="titlebar">'+icon('folder')+'Eksplorator plików<span class="spacer"></span>'+controls()+'</div><div class="explorerNav">← &nbsp; → &nbsp; ↑ &nbsp; <span style="background:white;border:1px solid #ccd8e8;padding:7px 15px;flex:1">Ten komputer &nbsp; › &nbsp; Dokumenty</span></div><div class="filesBody"><div class="side">　Strona główna<br>　Pulpit<br>　Dokumenty<br>　Pobrane<br>　Obrazy<br>　Ten komputer</div><div class="files">'+[['folder','Moje zadania'],['folder','Rysunki'],['doc','List.docx'],['photo','Foto.jpg']].map(([i,t])=>'<div class="file">'+icon(i)+t+'</div>').join('')+'</div></div></section>';}
const groups={optMixed:[['edge','Edge'],['photo','Foto.jpg'],['paint','Paint']],optPrograms:[['edge','Edge'],['paint','Paint'],['folder','Eksplorator plików']],optFiles:[['photo','Foto.jpg'],['doc','List.docx'],['music','Piosenka.mp3']]};
function choices(){return '<div class="choices">'+order.map((id,i)=>btn(id,'<span class="letter">'+(state.chosen&&id==='optPrograms'?'✓':'ABC'[i])+'</span>'+groups[id].map(([ico,t])=>'<span class="item">'+icon(ico)+t+'</span>').join(''),'choice '+(state.chosen?(id==='optPrograms'?'chosen':'dimmed'):''),'grupa '+'ABC'[i])).join('')+'</div>';}
function gmail(){return '<div class="gmailPage"><div class="gmailBrand">'+icon('mail')+' Gmail</div>'+(state.sent?'<div style="padding:25px;color:#64758b">Odebrane<br><br>Oznaczone gwiazdką<br><br>Wysłane</div><div style="position:absolute;top:90px;left:30%;right:30px;background:white;padding:25px;border-radius:14px;color:#65748b">Brak nowych wiadomości.</div><div class="toast" role="status">Wiadomość została wysłana.</div>':'<section class="compose"><div class="titlebar">Nowa wiadomość<span class="spacer"></span><div class="windowButtons">'+btn('gmailMin','−','','Zminimalizuj wiadomość')+btn('gmailMax','□','','Powiększ wiadomość')+btn('gmailClose','×','','Zamknij wiadomość')+'</div></div><div class="mailLine" data-action="gmailTo"><span>Do</span><span>zxcvb@gmail.com</span></div><div class="mailLine" data-action="gmailSubject"><span>Temat</span><span>zadanie</span></div><div class="mailBody" data-action="gmailBody">Dzień dobry,<br>przesyłam swoje zadanie.<br>Pozdrawiam,<br>Imię i nazwisko</div><div class="mailBottom">'+btn('gmailSend','Wyślij','send')+btn('gmailFormat','A')+btn('gmailAttach','📎')+btn('gmailLink','🔗')+btn('gmailEmoji','☺')+'<span style="flex:1"></span>'+btn('gmailTrash','🗑','','Usuń wiadomość')+'</div></section>')+'</div>';}
function render(){bar();$('taskbar').style.visibility=state.shutdown?'hidden':'';let content;if(state.shutdown)content='<div class="blackScreen '+(state.off?'off':'')+'">'+(state.off?'':'<span class="busyCursor"></span>Trwa zamykanie')+'</div>';else if(state.edgeOpen)content=browser();else if(state.filesOpen)content=explorer();else content=({desktop,browser,choice:choices,gmail})[task()?.scene||'desktop']();$('work').innerHTML=content;applyHint();}
function applyHint(){document.querySelectorAll('.hint').forEach(e=>e.classList.remove('hint'));if(hintOpen&&!solved){const id=task().steps[step].id;document.querySelectorAll('[data-action="'+id+'"]').forEach(e=>e.classList.add('hint'));}}
function feedback(t,bad=false){$('feedback').textContent=t;$('feedback').classList.toggle('statusBad',bad);}
function load(){cancel();step=0;state={};order=shuffle(Object.keys(groups));solved=false;helped=false;hintOpen=false;taskStarted=Date.now();$('meta').textContent=(round===1?'Pierwsza tura':'Powtórka '+(round-1))+' • Pytanie '+(idx+1)+' z '+queue.length;$('question').textContent=task().q;$('helpText').hidden=true;$('next').hidden=true;$('hint').disabled=false;feedback('');render();}
const lastRoundOrders=new Map();
function randomizeRound(){const key=queue.map(t=>t.id).sort().join('|');const old=lastRoundOrders.get(key)||queue.map(t=>t.id).join('|');queue=shuffle(queue);if(queue.length>1&&queue.map(t=>t.id).join('|')===old)queue.push(queue.shift());lastRoundOrders.set(key,queue.map(t=>t.id).join('|'));}
function newRound(){randomizeRound();idx=0;hard=new Set();active=true;$('intro').hidden=true;$('end').hidden=true;load();}function start(){stats={};tasks.forEach(t=>stats[t.id]={tries:0,ms:0});queue=[...tasks];round=1;started=Date.now();ended=0;newRound();}
const wrongText={addFav:'Ta gwiazdka dodaje zakładkę. Zapisane strony są pod gwiazdką z kreskami.',tabClose:'Ten krzyżyk zamyka kartę. Szukaj krzyżyka całego okna.',min:'To tylko chowa okno. Program nadal działa.',max:'To zmienia wielkość okna.',optMixed:'W tej grupie jest zdjęcie. To plik, nie program.',optFiles:'W tej grupie są same pliki, nie programy.',gmailClose:'Krzyżyk zamyka okno, ale nie wysyła wiadomości.',gmailTrash:'Kosz usuwa wiadomość, a nie wysyła jej.'};
function answer(id,el){if(!active||solved)return;const st=task().steps[step];if(id!==st.id){stats[task().id].tries++;hard.add(task().id);helped=true;beep(false);feedback('Ups! '+(wrongText[id]||'To nie to miejsce. Spróbuj jeszcze raz!'),true);if(step>0){step=0;state={};render();feedback('Ups! Zaczynamy ten obrazek od początku.',true);if(hintOpen)$('helpText').textContent=task().steps[step].hint;}else if(el){el.classList.add('wrong');later(()=>el.classList.remove('wrong'),650);}return;}
if(step<task().steps.length-1){state[st.effect]=true;step++;render();feedback('Dobrze! Klikaj dalej.');if(hintOpen)$('helpText').textContent=task().steps[step].hint;beep(true,false);return;}
solved=true;stats[task().id].tries++;stats[task().id].ms+=Date.now()-taskStarted;hintOpen=false;$('hint').disabled=true;$('helpText').hidden=true;feedback('Brawo!');confetti();beep(true,true);
let delay=2000;switch(st.effect){case 'edgeOpen':state.edgeOpen=true;render();break;case 'filesOpen':state.filesOpen=true;render();break;case 'newTab':state.newTab=true;render();break;case 'navigate':state.typing=true;state.url='';render();$('addressField').focus();const url='https://szkola.test/';for(let n=1;n<=url.length;n++)later(()=>{const e=$('addressField');if(e)e.value=url.slice(0,n);},n*55);later(()=>{state.url=url;state.typing=false;state.loaded=true;render();},1400);break;case 'shutdown':state={shutdown:true};render();later(()=>{state.off=true;render();},1000);break;case 'favorites':state.favorites=true;render();break;case 'closed':state={closed:true};render();break;case 'chosen':state.chosen=true;render();break;case 'sent':state.sent=true;render();break;}
if(st.effect==='navigate')feedback('Brawo! Otwieramy przykładową stronę.');
$('next').hidden=true;later(()=>{if(helped){feedback('Dobrze! To pytanie wróci jeszcze raz.');$('next').hidden=false;$('next').textContent=idx===queue.length-1?'Koniec tury →':'Dalej →';$('next').focus();}else advance();},delay);
}
function advance(){if(!active||!solved)return;if(++idx<queue.length)load();else finish();}
function plural(n){return n+' '+(n===1?'próba':n%10>=2&&n%10<=4&&!(n%100>=12&&n%100<=14)?'próby':'prób');}function fmt(ms){const s=Math.round(ms/1000);return Math.floor(s/60)+' min '+String(s%60).padStart(2,'0')+' s';}
function body(){const first=tasks.map((t,i)=>'Zadanie '+(i+1)+': '+plural(stats[t.id].tries)).join('\n');const second=tasks.map((t,i)=>'Zadanie '+(i+1)+': '+plural(stats[t.id].tries)+', czas: '+fmt(stats[t.id].ms)).join('\n');return 'Dzien dobry, \nprzesylam wyniki mojego zadania. \n'+first+'\nPozdrawiam serdecznie, uczeń kl. I/II'+'\n'.repeat(16)+second+'\nCzas wszystkich zadań razem: '+fmt(tasks.reduce((s,t)=>s+stats[t.id].ms,0))+'\nCzas całego quizu (od początku do końca ostatniej tury): '+fmt(ended-started);}
function emailURL(){return 'https://mail.google.com/mail/?'+new URLSearchParams({view:'cm',fs:'1',to:EMAIL_TO,su:EMAIL_SUBJECT,body:body()});}
function finish(){cancel();active=false;$('end').hidden=false;const n=hard.size;$('repeat').hidden=!n;$('email').hidden=!!n;$('emailNote').hidden=!!n;$('again').hidden=!!n;$('home').hidden=!!n;$('again').disabled=true;$('home').setAttribute('aria-disabled','true');$('home').setAttribute('tabindex','-1');$('result').innerHTML='';if(n){$('endTitle').textContent='Dobra robota!';$('endText').textContent='Do powtórzenia: '+n+'. Spróbuj teraz samodzielnie.';$('repeat').textContent='Powtórz trudniejsze zadania ('+n+')';}else{ended=Date.now();$('endTitle').textContent='Wszystko zrobione!';$('endText').textContent='Każde pytanie zostało opanowane. Wyślij wiadomość z wynikami.';$('result').innerHTML='<table class="results">'+tasks.map((t,i)=>'<tr><td>'+(i+1)+'. '+t.title+'</td><td>'+plural(stats[t.id].tries)+'</td></tr>').join('')+'</table><p>Cały quiz: '+fmt(ended-started)+'</p>';$('email').href=emailURL();confetti();}}
let noticeTimer;function notice(t){$('fsNotice').textContent=t;$('fsNotice').hidden=false;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('fsNotice').hidden=true,6500);}
async function full(){if(document.fullscreenElement)return;try{if(!document.documentElement.requestFullscreen)throw Error();await document.documentElement.requestFullscreen();}catch{notice('Nie udało się włączyć pełnego ekranu. Możesz użyć klawisza F11.');}}
$('start').onclick=()=>{full();start();};$('next').onclick=advance;$('repeat').onclick=()=>{queue=queue.filter(t=>hard.has(t.id));round++;newRound();};$('again').onclick=()=>{$('end').hidden=true;$('intro').hidden=false;};$('email').onclick=()=>{$('email').href=emailURL();$('again').disabled=false;$('home').setAttribute('aria-disabled','false');$('home').removeAttribute('tabindex');};$('home').addEventListener('click',e=>{if($('home').getAttribute('aria-disabled')==='true')e.preventDefault();});
$('hint').onclick=()=>{if(!active||solved)return;hintOpen=true;helped=true;hard.add(task().id);$('helpText').hidden=false;$('helpText').textContent=task().steps[step].hint;applyHint();};$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent='Dźwięk: '+(soundOn?'wł.':'wył.');$('sound').setAttribute('aria-pressed',soundOn);};
['work','taskbar'].forEach(id=>$(id).addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el)answer(el.dataset.action,el);}));
function beep(ok,long){if(!soundOn)return;try{audio||=new(window.AudioContext||window.webkitAudioContext)();audio.resume();(ok?(long?[523,659,784]:[660]):[220]).forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.1;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.06,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.24);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.26);});}catch{}}
const canvas=$('confetti'),ctx=canvas.getContext('2d');let particles=[],frame=null,cw=0,ch=0;function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;cw=canvas.clientWidth;ch=canvas.clientHeight;const d=devicePixelRatio||1;canvas.width=cw*d;canvas.height=ch*d;ctx.setTransform(d,0,0,d,0,0);for(let i=0;i<60;i++)particles.push({x:cw*(.2+.6*Math.random()),y:ch-3,vx:(Math.random()-.5)*3,vy:-Math.sqrt(.6*ch*(.35+.6*Math.random())),s:3+Math.random()*4,c:['#ff6b6b','#ffd23f','#4cc9f0','#5bd67f','#b388ff'][i%5],life:0});if(!frame)frame=requestAnimationFrame(tick);}function tick(){ctx.clearRect(0,0,cw,ch);particles=particles.filter(p=>p.life<150&&!(p.vy>0&&p.y>ch+10));particles.forEach(p=>{p.life++;p.vy+=.3;p.x+=p.vx;p.y+=p.vy;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s*.7);});frame=particles.length?requestAnimationFrame(tick):null;}
$('work').innerHTML=desktop();bar();$('hint').disabled=true;
</script></body></html>
